# ---- About 页：个人简介段落（支持 HTML 标签，如 <a href="...">） ----
about:
  - >-
    I am a Postdoctoral Fellow in the Department of Architecture and Civil Engineering at
    <a href="https://www.cityu.edu.hk/" target="_blank" rel="noopener">City University of Hong Kong</a>.
    I received my Ph.D. in Civil Engineering from the Department of Bridge Engineering, College of Civil Engineering,
    <a href="https://www.tongji.edu.cn/" target="_blank" rel="noopener">Tongji University</a> (2025),
    and was a visiting Ph.D. student in the Department of the Built Environment at the
    <a href="https://www.nus.edu.sg/" target="_blank" rel="noopener">National University of Singapore</a> (2023&ndash;2024),
    supported by the China Scholarship Council.
  - >-
    My research focuses on computer vision and machine learning for civil infrastructure,
    including structural health monitoring, vehicle load identification, vision-based damage detection,
    and time-series modeling of bridge monitoring data.
about_zh:
  - >-
    我是<a href="https://www.cityu.edu.hk/" target="_blank" rel="noopener">香港城市大学</a>建筑学及土木工程学系博士后研究员。
    2025 年于<a href="https://www.tongji.edu.cn/" target="_blank" rel="noopener">同济大学</a>土木工程学院桥梁工程系获土木工程博士学位，
    2023 至 2024 年由国家留学基金委（CSC）资助，赴
    <a href="https://www.nus.edu.sg/" target="_blank" rel="noopener">新加坡国立大学</a>建筑环境系访问学习。
  - >-
    我的研究聚焦于面向土木基础设施的计算机视觉与机器学习，涵盖结构健康监测、车辆荷载识别、
    基于视觉的损伤检测，以及桥梁监测数据的时间序列建模。

# ---- 研究兴趣 ----
research_interests_intro: >-
  Structural health monitoring &middot; Digital twin &middot; Computer vision &middot;
  Machine / deep learning &middot; Signal processing
research_interests_intro_zh: >-
  结构健康监测 &middot; 数字孪生 &middot; 计算机视觉 &middot;
  机器学习 / 深度学习 &middot; 信号处理
research_interests:
  - Monocular 3D vision algorithms based on geometric priors (standardized 3D reconstruction, automated homography estimation)
  - Vision-based detection of structural and bridge damages under small samples or changing illumination
  - Vision systems for accurate spatial-temporal identification of vehicle loads in complex environments
  - Time-frequency feature analysis and blind source separation of bridge health monitoring signals
  - Integration of Bayesian methods and deep learning for time-series prediction of sensor data
  - Vehicle load inversion and structural condition assessment based on vehicle-induced responses
research_interests_zh:
  - 基于几何先验的单目三维视觉算法（标准化三维重建、单应矩阵自动估计）
  - 小样本或光照变化条件下的结构与桥梁损伤视觉检测
  - 复杂环境下车辆荷载时空分布精确识别的视觉系统
  - 桥梁健康监测信号的时频特征分析与盲源分离
  - 贝叶斯方法与深度学习融合的传感器数据时间序列预测
  - 基于车致响应的车辆荷载反演与结构状态评估

